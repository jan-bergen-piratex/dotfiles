unbind C-b
set -g prefix F9
set -g repeat-time 0
bind F9 send-prefix

bind-key f popup -d "#{pane_current_path}"
bind-key h command-prompt -I "resize-pane -L "
bind-key j command-prompt -I "resize-pane -D "
bind-key k command-prompt -I "resize-pane -U "
bind-key l command-prompt -I "resize-pane -R "
# status
set -g status-interval 1
set -g status-left '┃#{?client_prefix,#[bg=blue] #[bold]GO #[bg=default],    }┃ #[bold]#S #[fg=black]┃'
set -g status-left-length 30
set -g status-right '┃ #{pane_current_path} ┃ %Y-%m-%d %H:%M ┃'
set -g status-right-style 'bg=green'
set -g status-right-length 100

setw -g window-status-current-style "bg=brightgreen"
setw -g window-status-current-format '#{?#{m/r:1,#{P:#{?#{m/r:^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏],#{pane_title}},1,0}}}, #{P:#{?#{m/r:^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏],#{pane_title}},#{=1:#{pane_title}},}} #I #W , #I #W }'

setw -g window-status-style "bg=green"
setw -g window-status-format '#{?#{m/r:1,#{P:#{?#{m/r:^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏],#{pane_title}},1,0}}}, #{P:#{?#{m/r:^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏],#{pane_title}},#{=1:#{pane_title}},}} #I #W , #I #W }'

setw -g window-status-separator '┃'

set -g focus-events on
set -g set-titles on
set -g set-titles-string '#{pane_title}'
set -g allow-passthrough on
set-window-option -g mode-keys vi

# continuum/resurrect
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @resurrect-processes '"~codex resume->codex-tmux"'
set -g @resurrect-capture-pane-contents 'on'

# TPM + plugins
set -g default-terminal "tmux-256color"
set -g default-shell /usr/bin/fish
set -ga terminal-overrides ",*:Tc"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g status-fg black
set -g status-style bg=green

setw -g mode-keys vi
set -g mouse on

run '~/.tmux/plugins/tpm/tpm'
